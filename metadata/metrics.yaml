  asset_profit:
    name: 资产盈亏
    domain: asset

    description: >
      客户在指定统计期间内的资产盈亏。
      按期末资产减期初资产，并对期间资金流入和流出进行调整。

    derived_from:
      - period_start_asset
      - period_end_asset
      - total_inflow
      - total_outflow

    expression: >
      period_end_asset
      - period_start_asset
      + total_outflow
      - total_inflow

    grain:
      - customer
      - period

    time_semantics: period_profit

    aggregation:
      default: none

    aliases:
      - 盈亏
      - 资产盈亏
      - 客户盈亏
      - 期间盈亏

    null_policy: treat_missing_flow_as_zero

    constraints:
      required_time_range: true

    explain:
      formula_text: 盈亏 = 期末资产 - 期初资产 + 期间总流出 - 期间总流入
      unit: 元
      decimal_places: 2
