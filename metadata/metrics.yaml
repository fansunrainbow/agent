  stock_holding_ratio:
    name: 股票持仓占比
    domain: allocation

    description: >
      客户股票类产品持仓市值占全部产品持仓市值的比例。

    derived_from:
      - stock_holding_value
      - holding_market_value

    expression: >
      stock_holding_value
      / NULLIF(holding_market_value, 0)

    grain:
      - customer
      - date

    time_semantics: daily_snapshot

    aggregation:
      default: none

    aliases:
      - 股票持仓占比
      - 股票占比
      - 股票配置比例

    null_policy: denominator_zero_returns_null

    explain:
      formula_text: 股票持仓占比 = 股票持仓市值 / 总持仓市值
      unit: 比例
      decimal_places: 4


