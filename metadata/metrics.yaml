  stock_trade_amount:
    name: 股票交易金额
    domain: trading

    description: >
      一级产品分类为“股票”的产品买入金额与卖出金额之和。

    source_tables:
      - dwd_cust_tran_d
      - dim_product

    source_fields:
      - dwd_cust_tran_d.buy_amt
      - dwd_cust_tran_d.sell_amt
      - dwd_cust_tran_d.prdt_id
      - dim_product.prdt_id
      - dim_product.up_prdt_type_name

    join:
      left_table: dwd_cust_tran_d
      right_table: dim_product
      on: prdt_id

    filter: >
      up_prdt_type_name = '股票'

    expression: >
      COALESCE(buy_amt, 0)
      + COALESCE(sell_amt, 0)

    grain:
      - customer
      - date
      - product

    time_semantics: daily_flow

    aggregation:
      default: sum

    aliases:
      - 股票交易额
      - 股票成交额
      - 股票交易金额

    null_policy: treat_as_zero

    explain:
      formula_text: 股票交易金额 = 股票买入金额 + 股票卖出金额
      unit: 元
      decimal_places: 2


