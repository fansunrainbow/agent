  product_entity:
    name: 产品实体
    category: entity

    source:
      table: dim_product

    aliases:
      - 产品
      - 产品名称
      - 证券产品

    entity_resolution:
      required: true
      rule_reference: product

    explain:
      text: >
        招商银行、比亚迪、中国平安等具体产品名称属于产品实体，
        不在词典中硬编码产品ID，而由实体检索规则解析。
      source: entity_resolution_rule


  branch_entity:
    name: 营业部实体
    category: entity

    source:
      table: dim_branch

    aliases:
      - 某营业部
      - 营业部名称
      - 具体营业部

    entity_resolution:
      required: true
      rule_reference: branch

    explain:
      text: >
        具体营业部名称通过 dim_branch 实体检索解析，
        不在业务词典中枚举所有营业部。
      source: entity_resolution_rule


  customer_entity:
    name: 客户实体
    category: entity

    source:
      table: ads_cust_info_d
      field: pty_id

    aliases:
      - 客户号
      - 客户ID
      - 指定客户

    entity_resolution:
      required: true
      rule_reference: customer

    explain:
      text: >
        指定客户通过客户标识 pty_id 解析，
        不在业务词典中枚举全部客户。
      source: entity_resolution_rule