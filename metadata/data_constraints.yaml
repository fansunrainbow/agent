database: agentic_marketing

constraints:

  time_constraints:

    customer_snapshot:
      table: ads_cust_info_d
      field: data_dt
      available_from: "20260531"
      available_to: "20260531"
      data_mode: snapshot
      description: 客户信息仅提供 2026-05-31 快照。
      rules:
        - 不得将客户等级、客户状态、地域、年龄等字段直接解释为 2026 年 1~3 月的历史属性。
        - 可以使用当前客户属性与历史事实进行联合分析，但结果应理解为“当前属性下的历史行为”。
      severity: high

    branch_snapshot:
      table: dim_branch
      field: data_dt
      available_from: "20260531"
      available_to: "20260531"
      data_mode: snapshot
      description: 营业部机构信息仅提供 2026-05-31 快照。
      rules:
        - 不保证营业部名称及上级机构关系能够还原 2026 年 1~3 月历史状态。
      severity: medium

    customer_asset_history:
      table: dws_cust_aset_d
      field: data_dt
      available_from: "20260101"
      available_to: "20260331"
      data_mode: historical_daily
      rules:
        - 超出该时间范围的资产查询不得伪造结果。
        - 用户询问超出范围时，应明确提示数据不可用。

    customer_fund_flow_history:
      table: dws_cust_fin_d
      field: data_dt
      available_from: "20260105"
      available_to: "20260331"
      data_mode: historical_daily

    customer_transaction_history:
      table: dwd_cust_tran_d
      field: data_dt
      available_from: "20260105"
      available_to: "20260331"
      data_mode: historical_daily

    customer_holding_history:
      table: dwd_cust_hold_d
      field: data_dt
      available_from: "20260101"
      available_to: "20260331"
      data_mode: historical_daily

  grain_constraints:

    ads_cust_info_d:
      grain:
        - pty_id
      duplicate_check: passed

    dim_branch:
      grain:
        - org_id

    dim_product:
      grain:
        - prdt_id

    dim_public:
      grain:
        - code_type_id
        - code

    dws_cust_aset_d:
      grain:
        - pty_id
        - data_dt
      duplicate_check: passed

    dws_cust_fin_d:
      grain:
        - pty_id
        - data_dt
        - sys_source
      duplicate_check: passed

    dwd_cust_tran_d:
      grain:
        - pty_id
        - data_dt
        - prdt_id
        - sys_source
        - ccy
      duplicate_check: passed

    dwd_cust_hold_d:
      grain:
        - pty_id
        - data_dt
        - prdt_id
        - sys_source
        - ccy
      duplicate_check: passed

  join_integrity:

    customer_links:
      key: pty_id
      unmatched_rows:
        dws_cust_aset_d: 0
        dws_cust_fin_d: 0
        dwd_cust_tran_d: 0
        dwd_cust_hold_d: 0
      status: passed

    product_links:
      key: prdt_id
      unmatched_rows:
        dwd_cust_tran_d: 0
        dwd_cust_hold_d: 0
      status: passed

    branch_links:
      key: org_id
      unmatched_rows:
        ads_cust_info_d: 0
      status: passed

  null_constraints:

    status: passed

    critical_fields:
      ads_cust_info_d:
        - pty_id
        - org_id
        - cust_age
        - prov_name
        - city_name

      dws_cust_aset_d:
        - data_dt
        - pty_id
        - nm_tot_aset
        - nm_bal
        - fc_pur_aset
        - fc_bal

      dws_cust_fin_d:
        - data_dt
        - pty_id
        - sys_source
        - cash_in
        - cash_out

      dwd_cust_tran_d:
        - data_dt
        - pty_id
        - prdt_id
        - sys_source
        - buy_amt
        - sell_amt

      dwd_cust_hold_d:
        - data_dt
        - pty_id
        - prdt_id
        - sys_source
        - hold_cnt
        - mkt_val

    observed_null_count: 0

  enum_constraints:

    sys_source:
      allowed_values:
        nm:
          description: 普通账户
        fc:
          description: 信用账户

      observed_in:
        dws_cust_fin_d:
          nm: 3733
          fc: 1159
        dwd_cust_tran_d:
          nm: 34183
          fc: 4877
        dwd_cust_hold_d:
          nm: 361600
          fc: 46550

    currency:
      field: ccy

      defined_values:
        "0": 人民币
        "1": 美元
        "2": 港币

      observed_values:
        - "0"

      observed_distribution:
        dwd_cust_tran_d:
          "0": 39060
        dwd_cust_hold_d:
          "0": 408150

      rules:
        - 当前数据中仅出现人民币。
        - 不得因为字段定义支持美元或港币，就假设当前数据包含美元或港币记录。
      severity: high

    cust_type:
      table: ads_cust_info_d
      observed_values:
        P: 500

    cust_lvl_cd:
      table: ads_cust_info_d
      dictionary_table: dim_public

      observed_values:
        "1000001": 30
        "1000002": 73
        "1000003": 118
        "1000004": 151
        "1000005": 63
        "1000006": 65

      rules:
        - 中文业务含义优先通过 dim_public 查询。
        - 不得仅依据编码数字大小推断客户等级高低。

    cust_status:
      table: ads_cust_info_d
      dictionary_table: dim_public

      observed_values:
        "2000001": 486
        "2000004": 11
        "2000005": 3

      rules:
        - 中文业务含义应通过 dim_public 查询。

    gender_cd:
      table: ads_cust_info_d
      dictionary_table: dim_public

      observed_values:
        "5000002": 318
        "5000003": 182

      rules:
        - 中文业务含义应通过 dim_public 查询。

  row_count_constraints:

    ads_cust_info_d:
      expected: 500
      observed: 500
      status: passed

    dim_branch:
      expected: 312
      observed: 312
      status: passed

    dim_product:
      expected: 334694
      observed: 334694
      status: passed

    dim_public:
      expected: 155
      observed: 155
      status: passed

    dws_cust_aset_d:
      expected: 43684
      observed: 43684
      status: passed

    dws_cust_fin_d:
      expected: 4892
      observed: 4892
      status: passed

    dwd_cust_tran_d:
      expected: 39060
      observed: 39060
      status: passed

    dwd_cust_hold_d:
      expected: 408150
      observed: 408150
      status: passed

query_rules:

  - id: respect_time_coverage
    description: 所有时间查询必须先检查目标事实表的数据覆盖范围。
    severity: high

  - id: no_historical_snapshot_assumption
    description: >
      不得把 2026-05-31 的客户或营业部快照属性，
      直接当作 2026 年 1~3 月对应日期的历史属性。
    severity: high

  - id: no_direct_fact_join
    description: >
      默认禁止不同事实表直接按客户号连接后进行指标聚合，
      以避免多对多连接造成金额重复计算。
    severity: high

  - id: aggregate_before_join
    description: >
      当查询同时涉及资产、交易、资金流、持仓等多个事实表时，
      应先分别聚合到统一分析粒度，再进行连接。
    severity: high

  - id: currency_observation_limit
    description: 当前事实数据实际只观察到人民币记录。
    severity: medium

  - id: dictionary_required
    description: >
      cust_lvl_cd、cust_status、gender_cd、edu_cd、prof_cd 等编码字段
      应优先借助 dim_public 获取业务含义。
    severity: high

  - id: dictionary_type_required
    description: >
      使用 dim_public 时必须考虑 code_type_id，
      禁止仅依据 code 与业务字段直接无条件连接。
    severity: high

  - id: preserve_grain
    description: 查询设计必须尊重各事实表已经验证的数据粒度。
    severity: high

  - id: no_fake_out_of_range_result
    description: >
      如果用户查询的数据日期超出可用时间范围，
      应返回数据不可用或说明覆盖范围，禁止推测或伪造。
    severity: high

validated_at:
  stage: data_model
  validation_status: passed

validation_summary:
  table_count: 8
  row_count_check: passed
  join_integrity_check: passed
  duplicate_check: passed
  null_check: passed
  date_range_check: passed
  enum_check: passed