version: "1.0"

intent_markers:
  trend_analysis:
    - 趋势
    - 变化趋势
    - 走势
    - 各月
    - 按月
    - 逐月
  comparison:
    - 对比
    - 比较
  group_analysis:
    - 按
    - 分组
    - 分布
  ranking:
    - 排名
    - 最高
    - 最低
    - 前
    - top

logic_markers:
  or:
    - 或
    - 或者
    - 任一
  not:
    - 排除
    - 不包括
    - 非

time_patterns:
  quarter: '(?:(?P<year>20\d{2})年?)?[Qq](?P<quarter>[1-4])'
  month: '(?P<year>20\d{2})年(?P<month>1[0-2]|0?[1-9])月'
  year: '(?P<year>20\d{2})年'
  last_n_days: '最近(?P<n>\d+)天'
  last_n_months: '最近(?P<n>\d+)个?月'
  latest:
    - 最新
    - 当前

number_units:
  万: 10000
  千: 1000
  百: 100
  亿: 100000000
  "%": 0.01

raw_metric_id_time_policy:
  enabled: true
  non_temporal_metrics:
    - customer_count
    - average_customer_age

entity_mentions:
  product:
    patterns:
      - '(?:持有|持仓|交易|买入|卖出)(?P<surface>[^，。；且并或]{2,30}?)的?客户'
    relation_targets:
      持有: held_product
      持仓: held_product
      交易: traded_product
      买入: traded_product
      卖出: traded_product
  branch:
    patterns:
      - '(?P<surface>[^，。；]{2,30}营业部)'
  parent_branch:
    patterns:
      - '(?P<surface>[^，。；]{2,30}分公司)'
  customer:
    patterns:
      - '(?P<surface>C\d{15})'

output_markers:
  detail:
    - 哪些客户
    - 客户列表
    - 筛选
    - 找出
    - 查询客户
  count:
    - 有多少
    - 多少客户
    - 客户数量
    - 客户数
    - 人数

metric_hints:
  customer_count:
    subject_markers:
      - 客户
    request_markers:
      - 有多少
      - 多少客户
      - 客户数量
      - 客户数
      - 人数
      - 分布

dynamic_dimension_values:
  city:
    strip_suffixes:
      - 市
  province:
    strip_suffixes:
      - 省

subject_by_dimension:
  product: product
  branch: branch
  parent_branch: branch

subject_markers:
  customer:
    - 客户
    - 客群
  product:
    - 产品
    - 证券
  branch:
    - 营业部
    - 分公司
    - 机构
